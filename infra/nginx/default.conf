# One origin for the browser: /api goes to the API with the prefix removed, everything else to the web app

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

# Limits per client address. A request over the limit and its burst gets a 429.
# Behind a tunnel or load balancer every client shares an address until the real one is restored
# with the real_ip module, so check that when this is deployed.
limit_req_status 429;
limit_req_zone $binary_remote_addr zone=guests:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=recovery:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=sign_in:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=speech:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=reports:10m rate=5r/m;

server {
    listen 80;
    server_tokens off;

    # What the browser may load and do. Next.js and MUI write inline scripts and styles, so those are
    # allowed, but nothing may come from, or frame the app on, another address.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Docker's resolver, with the upstreams in variables, so a recreated container is found again
    resolver 127.0.0.11 valid=10s;
    set $api_upstream http://api:8000;
    set $web_upstream http://web:3000;

    # Every /api location below is the same proxy, with its own limit
    location = /api/auth/guest {
        limit_req zone=guests burst=10 nodelay;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        include /etc/nginx/proxy-headers.conf;
    }

    location /api/auth/recovery/ {
        limit_req zone=recovery burst=5 nodelay;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        include /etc/nginx/proxy-headers.conf;
    }

    location /api/auth/ {
        limit_req zone=sign_in burst=20 nodelay;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        include /etc/nginx/proxy-headers.conf;
    }

    # Problem reports are stored for a person to read, so a loop should not fill the table
    location = /api/me/problem-reports {
        limit_req zone=reports burst=3 nodelay;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        include /etc/nginx/proxy-headers.conf;
    }

    # Speech is made on request: stream it to the browser and allow for a slow first clip
    location ~ ^/api/(exercises|items)/ {
        limit_req zone=speech burst=40 nodelay;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        include /etc/nginx/proxy-headers.conf;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        include /etc/nginx/proxy-headers.conf;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass $web_upstream;
        include /etc/nginx/proxy-headers.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
