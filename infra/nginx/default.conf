# One origin for the browser: /api goes to the API with the prefix removed, everything else to the web app

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    server_tokens off;

    # Docker's resolver, with the upstreams in variables, so a recreated container is found again
    resolver 127.0.0.11 valid=10s;
    set $api_upstream http://api:8000;
    set $web_upstream http://web:3000;

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        include /etc/nginx/proxy-headers.conf;

        # Speech is made on request: stream it to the browser and allow for a slow first clip
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass $web_upstream;
        include /etc/nginx/proxy-headers.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
