name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Poetry
        run: pipx install poetry

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: poetry

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Format
        run: poetry run ruff format --check engine tests

      - name: Lint
        run: poetry run ruff check engine tests

      - name: Type check
        run: poetry run mypy engine tests

      - name: Test
        run: poetry run pytest
