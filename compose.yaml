services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env}
      POSTGRES_DB: ${POSTGRES_DB:?Copy .env.example to .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username $${POSTGRES_USER} --dbname $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

  tts:
    build:
      context: .
      dockerfile: backend/tts/Dockerfile
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  # Creates the tables that are missing, then exits (safe to repeat)
  db-init:
    build: .
    image: dyfal-donc-api
    command: ["python", "-m", "persistence.database"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    image: dyfal-donc-api
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      TTS_URL: http://tts:8001
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    depends_on:
      db-init:
        condition: service_completed_successfully
      tts:
        condition: service_healthy

  web:
    build: frontend
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then((response) => process.exit(response.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    depends_on:
      api:
        condition: service_healthy

  # The only service published to the host: the browser sees one origin
  nginx:
    image: nginx:1.30-alpine
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/nginx/proxy-headers.conf:/etc/nginx/proxy-headers.conf:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      web:
        condition: service_healthy

volumes:
  postgres-data:
