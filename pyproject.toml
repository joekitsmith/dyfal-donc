[tool.poetry]
name = "dyfal-donc"
version = "0.1.0"
description = "Spaced-repetition Welsh speaking course with LLM-assisted, human-curated content"
readme = "README.md"
packages = [
    { include = "engine", from = "core" },
    { include = "cymraeg", from = "core" },
    { include = "evals", from = "backend" },
    { include = "tools", from = "backend" },
    { include = "simulation", from = "backend" },
    { include = "api", from = "backend" },
    { include = "persistence", from = "backend" },
    { include = "tts", from = "backend" },
]
authors = [
    "Joseph Smith <joesmith29@hotmail.co.uk>"
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.dependencies]
python = ">=3.14"
pydantic = "^2.14.3"
pyyaml = "^6.0.3"
fsrs = "^6.3.3"
fastapi = "^0.163.1"
sqlalchemy = "^2.1.8"
psycopg = {extras = ["binary"], version = "^3.3.9"}
uvicorn = "^0.54.0"
pydantic-settings = "^2.16.3"
httpx2 = "^2.16.0"

[tool.poetry.group.dev.dependencies]
mypy = "^1.18.2"
pre-commit = "^4.3.0"
pytest = "^9.0.2"
pytest-mock = "^3.15.1"
ruff = "^0.13.2"
hypothesis = "^6.170.15"
types-pyyaml = "^6.0.12.20261113"
poethepoet = "^0.49.0"
testcontainers = "^4.15.0"
types-docker = "^7.2.0.20261102"

[tool.poetry.group.lemmatisers]
optional = true

[tool.poetry.group.lemmatisers.dependencies]
simplemma = "^2.0.0"
stanza = "^1.15.1"

[tool.poetry.group.tts.dependencies]
piper-tts = "^1.8.0"
fastapi = "^0.163.1"
uvicorn = "^0.54.0"
pydantic-settings = "^2.16.3"

[tool.poe.tasks]
format = "ruff format core backend tests"
lint = "ruff check core backend tests"
lint-fix = "ruff check --fix core backend tests"
mypy = "mypy core backend tests"
tests-unit = "pytest tests/unit"
tests-integration = "pytest tests/integration"
benchmark = "python -m evals.benchmark"
suggest-forms = "python -m tools.suggest_forms"
simulate = "python -m simulation"
api = "uvicorn api.app:create_app --factory --reload"
db-create = "python -m persistence.database"
download-stanza-model = "python -c \"import stanza; stanza.download('cy', processors='tokenize,pos,lemma')\""
