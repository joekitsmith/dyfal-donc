- id: pat:mae-hi-yn-adj
  template: "Mae hi'n [ADJECTIVE]"
  english: "It's [ADJECTIVE]"
  slots: {ADJECTIVE: adj}
  prerequisites: [pat:mae-hi-yn]
  notes: "The adjective soft-mutates after 'n (Mae hi'n boeth)."

- id: pat:bydd-hi-yn
