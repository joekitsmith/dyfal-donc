  slots: {ADJECTIVE: adj}
  prerequisites: [pat:bydd-hi-yn, pat:mae-hi-yn-adj]
  notes: "The adjective soft-mutates after 'n."

- id: pat:rodd-hi-yn
  template: "Ro'dd hi'n [VERB]"
  english: "It was [VERB]ing"
  slots: {VERB: verb}
