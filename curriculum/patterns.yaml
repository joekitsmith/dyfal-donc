- id: pat:dw-in-moyn
  template: "Dw i'n moyn [VERB]"
  english: "I want to [VERB]"
  slots: {VERB: verb}
  notes: "South Wales. North Wales uses 'Dw i eisiau'. Deliberately taught as a chunk, not built up from 'moyn' and 'Dw i'n'."

- id: pat:dw-in
  template: "Dw i'n [VERB]"
  english: "I'm [VERB]ing"
  slots: {VERB: verb}
  notes: "Informal. Formal register is 'Rydw i'n'."

- id: pat:dw-i-ddim-yn
  template: "Dw i ddim yn [VERB]"
  english: "I'm not [VERB]ing"
  slots: {VERB: verb}
  prerequisites: [pat:dw-in]

- id: pat:wyt-ti-yn
  template: "Wyt ti'n [VERB]?"
  english: "Are you [VERB]ing?"
  slots: {VERB: verb}
  prerequisites: [pat:dw-in]

- id: pat:dw-i-ddim-yn-moyn
  template: "Dw i ddim yn moyn [VERB]"
  english: "I don't want to [VERB]"
  slots: {VERB: verb}
  prerequisites: [pat:dw-in-moyn, pat:dw-i-ddim-yn]

- id: pat:dw-in-moyn-noun
  template: "Dw i'n moyn [NOUN]"
  english: "I want [NOUN]"
  slots: {NOUN: noun}
  prerequisites: [pat:dw-in-moyn]

- id: pat:dw-in-hoffi
  template: "Dw i'n hoffi [NOUN]"
  english: "I like [NOUN]"
  slots: {NOUN: noun}
  prerequisites: [pat:dw-in]

- id: pat:wyt-ti-yn-moyn
  template: "Wyt ti'n moyn [VERB]?"
  english: "Do you want to [VERB]?"
  slots: {VERB: verb}
  prerequisites: [pat:dw-in-moyn, pat:wyt-ti-yn]

- id: pat:dw-in-gallu
  template: "Dw i'n gallu [VERB]"
  english: "I can [VERB]"
  slots: {VERB: verb}
  prerequisites: [pat:dw-in]
  notes: "Southern speakers also say 'Galla i [VERB]', which soft-mutates the verb-noun (galla i fynd). Not used here to avoid mutation."

- id: pat:mae-e-yn
  template: "Mae e'n [VERB]"
  english: "He's [VERB]ing"
  slots: {VERB: verb}
  prerequisites: [pat:dw-in]
  notes: "South Wales 'e'. North Wales uses 'o'."

- id: pat:galla-i
  template: "Galla i [VERB]"
  english: "I can [VERB]"
  slots: {VERB: verb}
  prerequisites: [pat:dw-in-gallu, lex:gallu]
  notes: "South Wales. The verb-noun soft-mutates (galla i fynd)."

- id: pat:dw-in-hoffi-r
  template: "Dw i'n hoffi'r [NOUN]"
  english: "I like the [NOUN]"
  slots: {NOUN: noun}
  prerequisites: [pat:dw-in-hoffi, lex:y]
  notes: "The noun after 'r' soft-mutates if it is feminine singular (hoffi'r Gymraeg)."

- id: pat:mae-hi-yn
  template: "Mae hi'n [VERB]"
  english: "She's [VERB]ing"
  slots: {VERB: verb}
  prerequisites: [pat:mae-e-yn]

- id: pat:dyn-ni-yn
  template: "Dyn ni'n [VERB]"
  english: "We're [VERB]ing"
  slots: {VERB: verb}
  prerequisites: [pat:dw-in]
  notes: "South Wales. North Wales uses 'Rydyn ni'n'."

- id: pat:dych-chi-yn
  template: "Dych chi'n [VERB]"
  english: "You're [VERB]ing (plural or polite)"
  slots: {VERB: verb}
  prerequisites: [pat:dw-in]
  notes: "Also a question with a rising voice: Dych chi'n siarad Cymraeg?"

- id: pat:maen-nhw-yn
  template: "Maen nhw'n [VERB]"
  english: "They're [VERB]ing"
  slots: {VERB: verb}
  prerequisites: [pat:dw-in]

- id: pat:dw-in-adj
  template: "Dw i'n [ADJECTIVE]"
  english: "I'm [ADJECTIVE]"
  slots: {ADJECTIVE: adj}
  prerequisites: [pat:dw-in]
  notes: "The adjective soft-mutates after 'n (Dw i'n flinedig, Dw i'n dda)."

- id: pat:mae-e-yn-adj
  template: "Mae e'n [ADJECTIVE]"
  english: "He's [ADJECTIVE]"
  slots: {ADJECTIVE: adj}
  prerequisites: [pat:mae-e-yn]
  notes: "The adjective soft-mutates after 'n (Mae e'n flinedig)."

- id: pat:dyw-e-ddim-yn
  template: "Dyw e ddim yn [VERB]"
  english: "He's not [VERB]ing"
  slots: {VERB: verb}
  prerequisites: [pat:mae-e-yn, pat:dw-i-ddim-yn]
  notes: "South Wales. Standard Welsh uses 'Dydy o ddim yn'."

- id: pat:es-i
  template: "Es i"
  english: "I went"
  notes: "South Wales past of 'mynd'. Taught as a chunk with no slot, because 'i' here is the pronoun."

- id: pat:des-i
  template: "Des i"
  english: "I came"
  notes: "South Wales past of 'dod'. Taught as a chunk with no slot."

- id: pat:nes-i
  template: "Nes i [VERB]"
  english: "I [VERB]ed"
  slots: {VERB: verb}
  prerequisites: [pat:dw-in]
  notes: "South Wales past of 'gwneud' as an auxiliary (Nes i weld e). The verb-noun soft-mutates (nes i fynd)."

- id: pat:nes-i-ddim
  template: "Nes i ddim [VERB]"
  english: "I didn't [VERB]"
  slots: {VERB: verb}
  prerequisites: [pat:nes-i, pat:dw-i-ddim-yn]
  notes: "The verb-noun is not mutated after 'ddim'."

- id: pat:ces-i
  template: "Ces i [NOUN]"
  english: "I had [NOUN]"
  slots: {NOUN: noun}
  notes: "South Wales past of 'cael'. The noun soft-mutates (Ces i goffi)."

- id: pat:nest-ti
  template: "Nest ti [VERB]?"
  english: "Did you [VERB]?"
  slots: {VERB: verb}
  prerequisites: [pat:nes-i]
  notes: "The verb-noun soft-mutates (Nest ti fynd?)."

- id: pat:gest-ti
  template: "Gest ti [NOUN]?"
  english: "Did you have [NOUN]?"
  slots: {NOUN: noun}
  prerequisites: [pat:ces-i]
  notes: "The noun soft-mutates (Gest ti goffi?)."

- id: pat:wna-i
  template: "Wna i [VERB]"
  english: "I'll [VERB]"
  slots: {VERB: verb}
  prerequisites: [pat:dw-in]
  notes: "South Wales future. The verb-noun soft-mutates (Wna i fynd)."

- id: pat:wna-i-ddim
  template: "Wna i ddim [VERB]"
  english: "I won't [VERB]"
  slots: {VERB: verb}
  prerequisites: [pat:wna-i, pat:dw-i-ddim-yn]
  notes: "The verb-noun is not mutated after 'ddim'."

- id: pat:bydda-in
  template: "Bydda i'n [VERB]"
  english: "I'll be [VERB]ing"
  slots: {VERB: verb}
  prerequisites: [pat:dw-in]

- id: pat:ro-ni-in
  template: "Ro'n i'n [VERB]"
  english: "I was [VERB]ing"
  slots: {VERB: verb}
  prerequisites: [pat:dw-in]
  notes: "South Wales. Standard Welsh uses 'Roeddwn i'n'."

- id: pat:mae-gyda-fi
  template: "Mae [NOUN] gyda fi"
  english: "I have [NOUN]"
  slots: {NOUN: noun}
  prerequisites: [pat:mae-e-yn, lex:gyda]
  notes: "South Wales. North Wales uses 'Mae gen i'."

- id: pat:oes
  template: "Oes [NOUN]?"
  english: "Is there [NOUN]?"
  slots: {NOUN: noun}

- id: pat:oes-gyda-ti
  template: "Oes [NOUN] gyda ti?"
  english: "Do you have [NOUN]?"
  slots: {NOUN: noun}
  prerequisites: [pat:oes, pat:mae-gyda-fi]

- id: pat:ydy-e-yn
  template: "Ydy e'n [VERB]?"
  english: "Is he [VERB]ing?"
  slots: {VERB: verb}
  prerequisites: [pat:mae-e-yn]
